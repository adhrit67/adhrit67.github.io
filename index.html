<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sped Kart 3D - Arcade Racer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #38bdf8;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .arcade-font {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 0.04em;
        }
        .text-stroke {
            -webkit-text-stroke: 2px #0f172a;
            text-shadow: 0 4px 0 #0f172a;
        }
        .text-stroke-lg {
            -webkit-text-stroke: 3px #0f172a;
            text-shadow: 0 6px 0 #0f172a;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px);
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }
        @keyframes pulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-fast {
            animation: pulseScale 0.6s infinite ease-in-out;
        }
        @keyframes rainbowBorder {
            0% { border-color: #ef4444; }
            25% { border-color: #eab308; }
            50% { border-color: #22c55e; }
            75% { border-color: #3b82f6; }
            100% { border-color: #ef4444; }
        }
        .item-roulette {
            animation: rainbowBorder 0.4s linear infinite;
        }
        .btn-arcade {
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 6px 0 #0f172a;
        }
        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f172a;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD Overlay (Visible during race) -->
    <div id="hud-overlay" class="fixed inset-0 pointer-events-none hidden flex-col justify-between p-4 sm:p-6">
        
        <!-- Top Row: Rank, Item Slot, Lap Counter -->
        <div class="flex justify-between items-start w-full">
            <!-- Rank Badge -->
            <div class="hud-card rounded-2xl px-4 py-2 sm:px-6 sm:py-3 flex items-baseline gap-1">
                <span id="hud-rank" class="arcade-font text-4xl sm:text-6xl font-bold text-yellow-400 text-stroke">1st</span>
                <span class="text-white/80 font-bold text-lg sm:text-2xl">/ 4</span>
            </div>

            <!-- Item Box Slot -->
            <div class="flex flex-col items-center">
                <div id="item-box-ui" class="hud-card w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex items-center justify-center relative overflow-hidden">
                    <span id="item-icon" class="text-4xl sm:text-5xl transform transition-transform duration-150"></span>
                </div>
                <div id="item-label" class="mt-1 bg-slate-900/90 text-white text-xs font-bold px-2.5 py-0.5 rounded-full border border-white/20 uppercase tracking-wider">
                    EMPTY
                </div>
            </div>

            <!-- Lap & Timer -->
            <div class="hud-card rounded-2xl px-4 py-2 sm:px-6 sm:py-3 text-right">
                <div class="text-xs sm:text-sm font-bold text-sky-300 uppercase tracking-wider">LAP</div>
                <div class="arcade-font text-3xl sm:text-5xl font-bold text-white text-stroke">
                    <span id="hud-lap">1</span><span class="text-xl sm:text-2xl text-white/70">/4</span>
                </div>
                <div id="hud-timer" class="text-xs sm:text-sm font-mono font-bold text-emerald-300 mt-0.5">00:00.0</div>
            </div>
        </div>

        <!-- Center Countdown / Event Banner -->
        <div class="flex flex-col items-center justify-center my-auto">
            <div id="countdown-text" class="arcade-font text-7xl sm:text-9xl font-bold text-yellow-400 text-stroke-lg hidden">
                3
            </div>
            <div id="wrong-way-banner" class="arcade-font text-3xl sm:text-5xl font-bold text-red-500 text-stroke hidden animate-pulse-fast">
                WRONG WAY!
            </div>
            <div id="lap-banner" class="arcade-font text-4xl sm:text-6xl font-bold text-emerald-400 text-stroke hidden">
                FINAL LAP!
            </div>
        </div>

        <!-- Bottom Row: Minimap & Speedometer -->
        <div class="flex justify-between items-end w-full">
            <!-- 2D Top-Down Mini-map -->
            <div class="hud-card rounded-2xl p-2 sm:p-3">
                <canvas id="minimap-canvas" width="140" height="140" class="w-28 h-28 sm:w-36 sm:h-36 rounded-xl bg-emerald-950/60"></canvas>
            </div>

            <!-- Drift Charge & Speedometer -->
            <div class="flex flex-col items-end gap-2">
                <!-- Drift Charge Meter -->
                <div id="drift-meter-container" class="hud-card rounded-full px-3 py-1.5 w-40 sm:w-48 hidden">
                    <div class="flex justify-between text-[10px] font-bold uppercase text-white mb-1">
                        <span>Drift Boost</span>
                        <span id="drift-status-text" class="text-sky-300">Charging</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                        <div id="drift-bar" class="h-full w-0 bg-gradient-to-r from-sky-400 via-yellow-400 to-orange-500 transition-all duration-75"></div>
                    </div>
                </div>

                <!-- Speedometer -->
                <div class="hud-card rounded-2xl px-4 py-2 sm:px-6 sm:py-3 flex items-baseline gap-1.5">
                    <span id="hud-speed" class="arcade-font text-3xl sm:text-5xl font-bold text-white text-stroke">0</span>
                    <span class="text-xs sm:text-sm font-bold text-sky-300">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls" class="sm:hidden flex justify-between items-center w-full mt-2 pointer-events-auto">
            <div class="flex gap-2">
                <button id="btn-left" class="w-14 h-14 bg-slate-900/80 active:bg-sky-500 border-2 border-white/40 rounded-2xl text-white text-2xl font-bold flex items-center justify-center">◀</button>
                <button id="btn-right" class="w-14 h-14 bg-slate-900/80 active:bg-sky-500 border-2 border-white/40 rounded-2xl text-white text-2xl font-bold flex items-center justify-center">▶</button>
            </div>
            <div class="flex gap-2">
                <button id="btn-item" class="w-14 h-14 bg-amber-500/90 active:bg-amber-400 border-2 border-white rounded-2xl text-slate-900 text-sm font-black flex items-center justify-center">ITEM</button>
                <button id="btn-drift" class="w-14 h-14 bg-sky-500/90 active:bg-sky-400 border-2 border-white rounded-2xl text-white text-xs font-black flex
